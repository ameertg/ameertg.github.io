<footer class="site-footer">
  <div class="container footer-inner">
    <p>© {{ "now" | date: "%Y" }} {{ site.author.name | escape }} · <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></p>
    <ul class="footer-links">
      {%- for link in site.author.links -%}
      <li><a href="{{ link.url }}" aria-label="{{ link.label }}" title="{{ link.label }}"><i class="{{ link.icon }}" aria-hidden="true"></i></a></li>
      {%- endfor -%}
      <li><a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed" title="RSS feed"><i class="fa-solid fa-rss" aria-hidden="true"></i></a></li>
    </ul>
  </div>
</footer>
