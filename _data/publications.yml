  volume: '428'
  pages: 329–340
  doi: 10.3233/faia260823
  url: https://doi.org/10.3233/faia260823
  pdf:
  abstract: 'Argument schemes are structured templates that capture common patterns of reasoning. We explore whether schemes can guide the automatic construction of formal proofs that derive an argument’s claim from its premises. To do this, we propose a pipeline that translates natural language into proofs in Isabelle/HOL, using argument schemes. The schemes are formalised systematically as inference rules in higher-order logic, and are used to structure proof generation within an iterative LLM-driven reasoning loop. Evaluating on a dataset of arguments that fully instantiate their schemes across 18 scheme types, we compare this scheme-guided approach against a baseline in which no scheme is provided. There are two sources of incompatibility between schemes and natural language arguments: one where the scheme’s conclusion does not directly match the argument’s claim, and one where the natural language premises are insufficient to satisfy the scheme’s requirements. We find that scheme guidance only marginally improves results overall, though when the scheme’s requirements are satisfied, the pipeline reliably closes the final inferential step; the bottleneck is that natural language arguments rarely make the required information explicit, and LLMs struggle to supply the necessary connections. Our error analysis reveals four key factors contributing to this incompatibility, and we suggest future directions to address them.'
