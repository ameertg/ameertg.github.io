  url: https://doi.org/10.7488/era/7016
  pdf:
  abstract: One of the key distinctions between classical formal logic and argumentative discourse is that the latter is a social process, often taking place through the exchange of language. The nature of language and social discourse means that arguments often employ unspoken inferential rules that are shaped by norms. While this process is informal, in the sense that these inferential rules and the procedure for exchanging arguments are very rarely explicitly established, patterns can be seen to emerge. This thesis seeks to model how implicit inferences arise in natural language arguments, using methods in computational linguistics to make these inferences explicit. The work described here takes an interdisciplinary approach using computational methods to operationalise existing theories, while also ensuring that computational methods are grounded in theoretical frameworks. This allows a theory of argumentation to be developed that is faithful to real-world data, while constraining the computational models to provide a meaningful and interpretable analysis of arguments. This thesis contributes to the existing literature by presenting various technical approaches to integrating world-knowledge in argument analysis; extending an existing theory of argumentation with an account of how seemingly non-sequitur arguments can be analysed; outlining how data can be reliably annotated for explicating implicit argumentative material; and, as a culmination of the results of this thesis, presents a method for identifying implicit premises that are crucial for generating critical questions to assess implicit assumptions behind arguments.
