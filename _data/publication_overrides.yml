  10.1007/978-3-030-87444-5_12:
    venue: TDA4MedicalData Workshop @ MICCAI 2021
    pdf: TDA21-Camera-Ready.pdf
    abstract: >-
      Alzheimer's disease is a debilitating disease in the elderly, and is an
      increasing burden to the society due to an aging population. In this
      paper, we apply topological data analysis to structural MRI scans of the
      brain, and show that topological invariants make accurate predictors for
      Alzheimer's. Using the construct of Betti Curves, we first show that
      topology is a good predictor of Age. Then we develop an approach to
      factor out the topological signature of age from Betti curves, and thus
      obtain accurate detection of Alzheimer's disease. Experimental results
      show that topological features used with standard classifiers perform
      comparably to recently developed convolutional neural networks. These
      results imply that topology is a major aspect of structural changes due
      to aging and Alzheimer's. We expect this relation will generate further
      insights for both early detection and better understanding of the
      disease.

# Papers OpenAlex doesn't have. Mark your own name with a leading *.
extra:
  - title: "KEViN: A Knowledge Enhanced Validity and Novelty Classifier for Arguments"
    authors: ["*Ameer Saadat-Yazdi", "Xue Li", "Sandrine Chausson", "Vaishak Belle", "Björn Ross", "Jeff Z. Pan", "Nadin Kökciyan"]
    year: 2022
    date: "2022-10-01"
    type: conference-paper
    venue: 9th Workshop on Argument Mining (ArgMining 2022)
    pages: 104–110
    url: https://aclanthology.org/2022.argmining-1.9
    pdf: ArgMining22-Camera-Ready.pdf
    abstract: >-
      The ArgMining 2022 Shared Task is concerned with predicting the validity
      and novelty of an inference for a given premise and conclusion pair. We
      propose two feed-forward network based models (KEViN1 and KEViN2), which
      combine features generated from several pretrained transformers and the
      WikiData knowledge graph. The transformers are used to predict
      entailment and semantic similarity, while WikiData is used to provide a
      semantic measure between concepts in the premise-conclusion pair. Our
      proposed models show significant improvement over RoBERTa, with KEViN1
      outperforming KEViN2 and obtaining second rank on both subtasks (A and
      B) of the ArgMining 2022 Shared Task.
